name: Scan with Grype (reusable)

on:
  workflow_call:
    inputs:
      fail-build:
        description: Fail the build if vulnerabilities detected
        type: boolean
        required: false
        default: true

jobs:
  grype-scan:
    name: Run Grype security scan
    runs-on: ubuntu-24.04
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan current project with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        id: scan
        with:
          path: '.'
          fail-build: ${{ inputs.fail-build }}

      - name: Upload SARIF report to GitHub
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype
