name: Push and sign image

# This workflow takes a previously built Docker image which has been uploaded as a
# workflow artifact and
#
#  * downloads it;
#  * pushes it to the ghcr.io registry under the supplied name
#  * creates provenance attestations for it;
#  * signs it;
#  * updates the supplied tag to point to this version of the image.
#
# It returns the digest of the image and, for convenience, the fully qualified image
# reference for use in other workflows.
#
# It expects the artifact to be a ZStandard compressed tarball named like:
# $DOCKER_IMAGE_NAME.tar.zst
#
# The `save-image-as-artifact` composite action creates appropriate artifacts.

on:
  workflow_call:
    inputs:
      artifact-name: {type: string, required: true}
      public-image-name: {type: string, required: true}
      tag: {type: string, required: true}
    outputs:
      digest:
        value: ${{ jobs.push-and-sign-image.outputs.digest }}
      image-ref:
        value: "${{ inputs.public-image-name }}@${{ jobs.push-and-sign-image.outputs.digest }}"

permissions:
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  push-and-sign-image:
    name: Push and sign image
    outputs:
      digest: ${{ steps.get-digest.outputs.digest }}
    runs-on: ubuntu-24.04
    steps:

    - name: Download image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ inputs.artifact-name }}
        path: /tmp/image

    - name: Get image name
      id: get-name
      run: |
        set -euo pipefail

        readarray -t IMAGE_NAMES < <(
          find /tmp/image/ -printf '%f\n' | sed -rn 's/(^.+)\.tar\.zst/\1/p'
        )

        if (( ${#IMAGE_NAMES[@]} != 1 )); then
          echo "Expected exactly one .tar.zst file in artifact"
          ls -lh /tmp/image
          exit 1
        fi

        echo "name=${IMAGE_NAMES[0]}" >> "$GITHUB_OUTPUT"

    - name: Import image
      run: |
        zstd --decompress --stdout /tmp/image/*.tar.zst \
         | docker image load

    - name: Docker login
      run: |
        echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

    - name: Push image
      env:
        PUBLIC_IMAGE_NAME: ${{ inputs.public-image-name }}
        LOCAL_IMAGE_NAME: ${{ steps.get-name.outputs.name }}
        # Before we can attest and sign the image we need to push it to the registry. To
        # avoid implicitly updating the `latest` tag we must supply _some_ tag, but we
        # don't care what it is so long as it doesn't clash with any tags we do care
        # about. Because we never read the value of this tag we don't care if multiple
        # concurrent clients race to update it. And using a single fixed tag means that
        # we avoid polluting our tag namespace.
        EPHEMERAL_TAG: temporary-build-image
      run: |
        docker tag "$LOCAL_IMAGE_NAME" "$PUBLIC_IMAGE_NAME:$EPHEMERAL_TAG"
        docker push "$PUBLIC_IMAGE_NAME:$EPHEMERAL_TAG"

    - name: Get image digest
      id: get-digest
      env:
        PUBLIC_IMAGE_NAME: ${{ inputs.public-image-name }}
        LOCAL_IMAGE_NAME: ${{ steps.get-name.outputs.name }}
      run: |
        set -euo pipefail

        REPO_DIGESTS="$(
          docker inspect --format="{{join .RepoDigests \"\n\"}}" "$LOCAL_IMAGE_NAME"
        )"

        readarray -t MATCHING_DIGESTS < <(
          grep --fixed-strings -- "${PUBLIC_IMAGE_NAME}@" <<< "$REPO_DIGESTS" || true
        )

        if (( ${#MATCHING_DIGESTS[@]} != 1 )); then
          echo "Expected exactly one matching digest for $PUBLIC_IMAGE_NAME"
          echo "REPO_DIGESTS: $REPO_DIGESTS"
          echo "MATCHING_DIGESTS: ${MATCHING_DIGESTS[*]}"
          exit 1
        fi

        # Extract the substring after the final "@"
        echo "digest=${MATCHING_DIGESTS[0]##*@}" >> "$GITHUB_OUTPUT"

    - name: Attest provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.public-image-name }}
        subject-digest: ${{ steps.get-digest.outputs.digest }}
        push-to-registry: true

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign image
      env:
        PUBLIC_IMAGE_NAME: ${{ inputs.public-image-name }}
        DIGEST: ${{ steps.get-digest.outputs.digest }}
      run: |
        cosign sign --yes "${PUBLIC_IMAGE_NAME}@${DIGEST}"

    - name: Update tag
      env:
        PUBLIC_IMAGE_NAME: ${{ inputs.public-image-name }}
        DIGEST: ${{ steps.get-digest.outputs.digest }}
        TAG: ${{ inputs.tag }}
      run: |
        docker tag "${PUBLIC_IMAGE_NAME}@${DIGEST}" "${PUBLIC_IMAGE_NAME}:${TAG}"
        docker push "${PUBLIC_IMAGE_NAME}:${TAG}"
